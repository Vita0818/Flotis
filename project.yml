name: Flotis
options:
  bundleIdPrefix: com.Vita0818
  developmentLanguage: en
targets:
  Flotis:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Flotis
    info:
      path: Flotis/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMultipleInstancesProhibited: true
        NSMicrophoneUsageDescription: "Flotis uses the microphone for voice input."
        NSSpeechRecognitionUsageDescription: "Flotis uses Speech Recognition to turn your speech into text."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Vita0818.FlotisMac
        MARKETING_VERSION: 0.8.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
  FlotisTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: FlotisTests
    dependencies:
      - target: Flotis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Vita0818.FlotisMacTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
