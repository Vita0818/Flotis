name: Flotis
options:
  bundleIdPrefix: com.Vita0818
targets:
  Flotis:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Flotis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Vita0818.FlotisMac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Flotis 需要使用语音识别将你的讲话转换成文本。"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Flotis 需要使用麦克风进行语音输入。"
        MARKETING_VERSION: 0.8.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
  FlotisTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: FlotisTests
    dependencies:
      - target: Flotis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Vita0818.FlotisMacTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
